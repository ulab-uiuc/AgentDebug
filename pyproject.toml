[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agentdebug"
version = "0.1.0"
description = "A framework for understanding, detecting, and recovering from LLM agent failures"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "aiohttp",
    "openai",
    "anthropic",
    "google-genai",
    "together",
    "python-dotenv",
    "ray[default]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
]

[tool.setuptools.packages.find]
include = ["agentdebug*"]
